<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b263b"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00c6ff"/>
    </linearGradient>
    <linearGradient id="pulse-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <style>
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.05); opacity: 1; }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -100; }
      }
      .particle { animation: pulse 3s infinite ease-in-out; }
      .floating { animation: float 4s infinite ease-in-out; }
      .wire { stroke-dasharray: 6 4; animation: dash 2s linear infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)"/>

  <!-- Circuit grid lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.6">
    <line x1="100" y1="0" x2="100" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="900" y1="0" x2="900" y2="360"/>
    <line x1="1100" y1="0" x2="1100" y2="360"/>
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
  </g>

  <!-- Streaming animated wires -->
  <path d="M 120 180 L 320 180 L 380 120 L 520 120" fill="none" stroke="#00f2fe" stroke-width="2.5" class="wire" filter="url(#glow)"/>
  <path d="M 680 120 L 820 120 L 880 180 L 1080 180" fill="none" stroke="#4facfe" stroke-width="2.5" class="wire" filter="url(#glow)"/>
  <path d="M 320 180 L 380 240 L 520 240" fill="none" stroke="#ff007f" stroke-width="2.5" class="wire" filter="url(#glow)"/>
  <path d="M 680 240 L 820 240 L 880 180" fill="none" stroke="#7928ca" stroke-width="2.5" class="wire" filter="url(#glow)"/>

  <!-- Floating Hub Icon -->
  <g class="floating" transform="translate(600, 180)">
    <circle r="52" fill="#0f172a" stroke="url(#accent-grad)" stroke-width="3" filter="url(#glow)"/>
    <polygon points="-16,-24 24,0 -16,24" fill="url(#accent-grad)"/>
    <circle cx="0" cy="0" r="8" fill="#ffffff" class="particle"/>
  </g>

  <!-- Left Node: IDL Schema -->
  <g transform="translate(180, 180)">
    <circle r="36" fill="#111827" stroke="#00f2fe" stroke-width="2" filter="url(#glow)"/>
    <text x="0" y="5" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" text-anchor="middle">.SYNAPSE</text>
    <text x="0" y="54" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" text-anchor="middle">Schema IDL</text>
  </g>

  <!-- Right Node: Multi-Target Codegen -->
  <g transform="translate(1020, 180)">
    <circle r="36" fill="#111827" stroke="#4facfe" stroke-width="2" filter="url(#glow)"/>
    <text x="0" y="5" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" text-anchor="middle">RS • TS • GO</text>
    <text x="0" y="54" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" text-anchor="middle">Reactive Codegen</text>
  </g>

  <!-- Title & Typography -->
  <text x="600" y="70" fill="url(#accent-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="34" letter-spacing="2" text-anchor="middle" filter="url(#glow)">
    SYNAPSE RPC COMPILER
  </text>
  <text x="600" y="102" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="15" text-anchor="middle">
    Reactive Type-Safe Binary RPC Wire Protocol &amp; Multi-Language Code Generation
  </text>

  <!-- Subtitle Badges -->
  <g transform="translate(420, 305)">
    <rect width="105" height="26" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="52" y="17" fill="#38bdf8" font-family="monospace" font-size="11" text-anchor="middle">⚡ 31ns Codec</text>
  </g>
  <g transform="translate(545, 305)">
    <rect width="115" height="26" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="57" y="17" fill="#a78bfa" font-family="monospace" font-size="11" text-anchor="middle">🔄 Multiplexing</text>
  </g>
  <g transform="translate(680, 305)">
    <rect width="105" height="26" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="52" y="17" fill="#4ade80" font-family="monospace" font-size="11" text-anchor="middle">🛡️ Zero-Copy</text>
  </g>
</svg>
